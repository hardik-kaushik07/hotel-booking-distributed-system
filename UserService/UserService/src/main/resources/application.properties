spring.application.name=User-Service

spring.datasource.url = ${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.config.import=optional:configserver:http://localhost:8085

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.ratingHotelBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.ratingHotelBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.ratingHotelBreaker.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.ratingHotelBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ratingHotelBreaker.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.ratingHotelBreaker.automaticTransitionFromOpenToHalfOpenEnable=true
resilience4j.circuitbreaker.instances.ratingHotelBreaker.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instance=ratingHotelBreaker
resilience4j.retry.maxAttempt=3
resilience4j.retry.waitDuration=3s

resilience4j.ratelimiter.instance=ratingHotelBreaker
resilience4j.ratelimiter.timeout-Duration=0s
resilience4j.ratelimiter.limit-for-period=2
resilience4j.ratelimiter.limit-refresh-period=4s

resilience4j.circuitbreaker.instances.hotelRatingBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.hotelRatingBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.hotelRatingBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.hotelRatingBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.hotelRatingBreaker.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.hotelRatingBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.hotelRatingBreaker.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.hotelRatingBreaker.automaticTransitionFromOpenToHalfOpenEnable=true
resilience4j.circuitbreaker.instances.hotelRatingBreaker.permittedNumberOfCallsInHalfOpenState=3


#eureka.instance.prefer-ip-address = true
#eureka.client.register-with-eureka = true
#eureka.client.fetch-registry = true
#eureka.client.service.url.defaultZone = http://localhost:8761/eureka


# OAuth2 Client configuration ? required for login
spring.security.oauth2.client.registration.okta.client-id=${OKTA_CLIENT_ID}
spring.security.oauth2.client.registration.okta.client-secret=${OKTA_CLIENT_SECRET}
spring.security.oauth2.client.registration.okta.provider=okta
spring.security.oauth2.client.registration.okta.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.okta.scope=Internal
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER_URI}
spring.security.oauth2.client.provider.okta.issuer-uri=${OKTA_ISSUER_URI}

# Keep these if you also use Okta JWT resource-server support
okta.oauth2.issuer=${OKTA_ISSUER_URI}
okta.oauth2.audience=${OKTA_AUDIENCE}