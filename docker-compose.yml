networks:
  kafka_network:
    name: microservices_kafka_network
    driver: bridge

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3308:3306"
    networks:
      - kafka_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - kafka_network


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - kafka_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'Local-KRaft-Cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
    depends_on:
      kafka:
        condition: service_started
    networks:
      - kafka_network


  eureka-server:
    build:
      context: "./ServiceRegistry/ServiceRegistry"
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - kafka_network

  config-server:
    build:
      context: "./Config Service/Config-Service"
      dockerfile: Dockerfile
    container_name: config-server
    depends_on:
      eureka-server:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      GITHUB_URI: https://github.com/hardik-kaushik07/microservices-config-server
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      JAVA_TOOL_OPTIONS: "-Deureka.client.register-with-eureka=false -Deureka.client.fetch-registry=false"
    networks:
      - kafka_network

  api-gateway:
    build:
      context: "./API Gateway/API-Gateway"
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      zipkin:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET}
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
      OKTA_JWK_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
      OKTA_REDIRECT_URI: http://localhost:8084/login/oauth2/code/okta
      OKTA_SCOPE: openid,profile,email,offline_access,Internal
    networks:
      - kafka_network


  hotel-service:
    build:
      context: "./HotelService/HotelService"
      dockerfile: Dockerfile
    container_name: hotel-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      zipkin:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
      OKTA_JWK_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_JWT_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
    networks:
      - kafka_network

  user-service:
    build:
      context: "./UserService/UserService"
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      zipkin:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
      OKTA_JWK_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
    networks:
      - kafka_network

  rating-service:
    build:
      context: "./RatingService/RatingService"
      dockerfile: Dockerfile
    container_name: rating-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
      OKTA_JWK_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_JWT_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
    networks:
      - kafka_network

  booking-service:
    build:
      context: "./BookingService/BookingService"
      dockerfile: Dockerfile
    container_name: booking-service
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true
      DB_USERNAME: root
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect

      CONFIG_SERVER_URL: optional:configserver:http://config-server:8085
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085

      KAFKA_BOOTSTRAP_SERVER_PORT: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092

      JWT_ISSUER_URI: ${OKTA_ISSUER_URI}
      JWK_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}

      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/ -Dspring.kafka.bootstrap-servers=kafka:29092 -Dspring.kafka.consumer.bootstrap-servers=kafka:29092"
    networks:
      - kafka_network

  payment-service:
    build:
      context: "./Payment-Service/Payment-Service"
      dockerfile: Dockerfile
    container_name: payment-service
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: "8088"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8085
      KAFKA_BOOTSTRAP_SERVER_PORT: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_URI: http://eureka-server:8761/eureka/
    networks:
      - kafka_network

  notification-service:
    build:
      context: "./NotificationService/NotificationService"
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: "8087"
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8085
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      OKTA_CLIENT_ID: ${NOTIFICATION_OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${NOTIFICATION_OKTA_CLIENT_SECRET}
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI}
      OKTA_JWK_SET_URI: ${OKTA_JWK_SET_URI}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
    networks:
      - kafka_network