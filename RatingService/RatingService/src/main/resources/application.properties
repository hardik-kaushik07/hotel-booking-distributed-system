spring.application.name=Rating-Service

spring.datasource.url = ${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port = 8082

spring.config.import=optional:configserver:http://localhost:8085

#eureka.instance.prefer-ip-address = true
#eureka.client.fetch-registry = true
#eureka.client.register-with-eureka = true
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OKTA_JWT_SET_URI}
okta.oauth2.issuer=${OKTA_ISSUER_URI}
okta.oauth2.audience=${OKTA_AUDIENCE}


# Send 100% of traces to Zipkin (Default is 10%, which skips some requests)
management.tracing.sampling.probability=1.0

# Point to your Docker Zipkin container
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# CRITICAL FOR KAFKA: Tell Spring to attach Trace IDs to Kafka messages
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

