spring.application.name=API-Gateway


#This api gateway help to talk to all the services, we only have to talk to api gateway.
#The API Gateway acts as a single entry point for clients. It receives the request,
# forwards it to the appropriate microservice, and returns that service's response to the client.

server.port = 8084

spring.config.import=optional:configserver:http://localhost:8085

eureka.instance.prefer-ip-address = true
eureka.client.register-with-eureka = true
eureka.client.fetch-registry = true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.main.web-application-type=reactive

# USER SERVICE
spring.cloud.gateway.routes[0].id=USER-SERVICE
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[0].filters[0]=TokenRelay=

# HOTEL SERVICE
spring.cloud.gateway.routes[1].id=HOTEL-SERVICE
spring.cloud.gateway.routes[1].uri=lb://HOTEL-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/hotels/**
spring.cloud.gateway.routes[1].filters[0]=TokenRelay=

# RATING SERVICE
spring.cloud.gateway.routes[2].id=RATING-SERVICE
spring.cloud.gateway.routes[2].uri=lb://RATING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/ratings/**
spring.cloud.gateway.routes[2].filters[0]=TokenRelay=

# BOOKING SERVICE
spring.cloud.gateway.routes[3].id=BOOKINGSERVICE
spring.cloud.gateway.routes[3].uri=lb://BOOKINGSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/bookings/**
spring.cloud.gateway.routes[3].filters[0]=TokenRelay=


# Enable dynamic Eureka routing fallback
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Log incoming paths and matched route IDs
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO

# OAuth2 Client configuration ? required for login
spring.security.oauth2.client.registration.okta.client-id=${OKTA_CLIENT_ID}
spring.security.oauth2.client.registration.okta.client-secret=${OKTA_CLIENT_SECRET}
spring.security.oauth2.client.registration.okta.client-name=Okta
spring.security.oauth2.client.registration.okta.provider=okta
spring.security.oauth2.client.registration.okta.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.okta.redirect-uri=${OKTA_REDIRECT_URI}
spring.security.oauth2.client.registration.okta.scope=${OKTA_SCOPE}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER_URI}
spring.security.oauth2.client.provider.okta.issuer-uri=${OKTA_ISSUER_URI}

# Keep these if you also use Okta JWT resource-server support
okta.oauth2.issuer=${OKTA_ISSUER_URI}
okta.oauth2.audience=${OKTA_AUDIENCE}


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG 


# Send 100% of traces to Zipkin (Default is 10%, which skips some requests)
management.tracing.sampling.probability=1.0

# Point to your Docker Zipkin container
management.zipkin.tracing.endpoint=ZIPKIN_URL

# CRITICAL FOR KAFKA: Tell Spring to attach Trace IDs to Kafka messages
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true