spring.application.name=API-Gateway


#This api gateway help to talk to all the services, we only have to talk to api gateway.
#The API Gateway acts as a single entry point for clients. It receives the request,
# forwards it to the appropriate microservice, and returns that service's response to the client.

server.port = 8084

eureka.instance.prefer-ip-address = true
eureka.client.register-with-eureka = true
eureka.client.fetch-registry = true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.main.web-application-type=reactive

spring.cloud.gateway.server.webflux.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**, /users/getAll

spring.cloud.gateway.server.webflux.routes[1].id=HOTEL-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://HOTEL-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/hotels/getAll, /hotels/**

spring.cloud.gateway.server.webflux.routes[2].id=RATING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://RATING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ratings/**

# OAuth2 Client configuration ? required for login
spring.security.oauth2.client.registration.okta.client-id=${OKTA_CLIENT_ID}
spring.security.oauth2.client.registration.okta.client-secret=${OKTA_CLIENT_SECRET}
spring.security.oauth2.client.registration.okta.client-name=Okta
spring.security.oauth2.client.registration.okta.provider=okta
spring.security.oauth2.client.registration.okta.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.okta.redirect-uri=${OKTA_REDIRECT_URI}
spring.security.oauth2.client.registration.okta.scope=${OKTA_SCOPE}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER_URI}
spring.security.oauth2.client.provider.okta.issuer-uri=${OKTA_ISSUER_URI}

# Keep these if you also use Okta JWT resource-server support
okta.oauth2.issuer=${OKTA_ISSUER_URI}
okta.oauth2.audience=${OKTA_AUDIENCE}


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG 