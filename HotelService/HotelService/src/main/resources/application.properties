spring.application.name=Hotel-Service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

spring.config.import=optional:configserver:http://localhost:8085

#eureka.instance.prefer-ip-address = true
#eureka.client.fetch-registry = true
#eureka.client.register-with-eureka = true
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka


spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER_URI:https://integrator-6585526.okta.com/oauth2/default}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OKTA_JWK_SET_URI:https://integrator-6585526.okta.com/oauth2/default/v1/keys}
okta.oauth2.issuer=${OKTA_ISSUER_URI:https://integrator-6585526.okta.com/oauth2/default}
okta.oauth2.audience=${OKTA_AUDIENCE:api://default}


# Send 100% of traces to Zipkin (Default is 10%, which skips some requests)
management.tracing.sampling.probability=1.0

# Point to your Docker Zipkin container
management.zipkin.tracing.endpoint=${ZIPKIN_URL}

# CRITICAL FOR KAFKA: Tell Spring to attach Trace IDs to Kafka messages
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true