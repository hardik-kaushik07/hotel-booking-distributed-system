spring.application.name=BookingService

server.port= 8086

spring.config.import=${CONFIG_SERVER_URL}


spring.datasource.url=${DB_URL}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Kafka Producer Setup
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER_PORT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}
okta.oauth2.issuer=${JWT_ISSUER_URI}
okta.oauth2.audience=${OKTA_AUDIENCE}

spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER_PORT}
spring.kafka.consumer.group-id=booking-group-final-1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.auto-startup=true
logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.kafka.listener=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO


# Send 100% of traces to Zipkin (Default is 10%, which skips some requests)
management.tracing.sampling.probability=1.0

# Point to your Docker Zipkin container
management.zipkin.tracing.endpoint=${ZIPKIN_URI}
# CRITICAL FOR KAFKA: Tell Spring to attach Trace IDs to Kafka messages
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true