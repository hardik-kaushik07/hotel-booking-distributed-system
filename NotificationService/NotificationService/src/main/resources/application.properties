spring.application.name=NotificationService

server.port=8087

spring.config.import=${CONFIG_SERVER_URL}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group-v6
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Set Spring Kafka to INFO so partition assignment is visible
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO


# OAuth2 Client Credentials for M2M communication
spring.security.oauth2.client.registration.internal-client.provider=okta
spring.security.oauth2.client.registration.internal-client.client-id=${OKTA_CLIENT_ID}
spring.security.oauth2.client.registration.internal-client.client-secret=${OKTA_CLIENT_SECRET}
spring.security.oauth2.client.registration.internal-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal-client.scope=Internal

# Okta Authorization Server
spring.security.oauth2.client.provider.okta.issuer-uri=${OKTA_ISSUER_URI}


# Send 100% of traces to Zipkin (Default is 10%, which skips some requests)
management.tracing.sampling.probability=1.0

# Point to your Docker Zipkin container
management.zipkin.tracing.endpoint=${ZIPKIN_URI}

# CRITICAL FOR KAFKA: Tell Spring to attach Trace IDs to Kafka messages
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true